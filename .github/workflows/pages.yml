# Builds the static site and deploys it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# The site uses root-absolute paths (/assets/..., /child-safety), so serve it
# from a custom domain (or a <user>.github.io repo), not a /<repo>/ subpath.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Absolute URLs, canonicals, JSON-LD, sitemap.xml, robots.txt, and
      # flat /page.html files (which also puts the Webstudio /404 page at
      # /404.html, where GitHub Pages looks for it). See the script header.
      - name: SEO post-processing
        run: node scripts/seo-postbuild.mjs dist/client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
