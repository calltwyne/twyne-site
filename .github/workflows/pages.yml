# Builds the static site and deploys it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# The site uses root-absolute paths (/assets/..., /child-safety), so serve it
# from a custom domain (or a <user>.github.io repo), not a /<repo>/ subpath.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages serves /404.html for missing URLs. The "Not found" page is
      # built from Webstudio at /404, so copy it into place.
      - name: Add 404 page
        run: cp dist/client/404/index.html dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
